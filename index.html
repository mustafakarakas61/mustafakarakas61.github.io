<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mussiworks</title>
<meta name="description" content="Mussiworks: özgün mobil oyunlar ve işe yarar uygulamalar. Original mobile games and useful apps.">
<meta property="og:title" content="Mussiworks">
<meta property="og:description" content="Özgün mobil oyunlar ve işe yarar uygulamalar.">
<meta property="og:image" content="https://mustafakarakas61.github.io/logo.png">
<meta name="theme-color" content="#0E1830">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1830;
    --bg-2: #1a2e56;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --muted: #aab4cc;
    --mint: #52d6ba;
    --coral: #ec5860;
    --gold: #ffc450;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-2), transparent 70%),
      radial-gradient(ellipse 60% 40% at 85% 100%, rgba(236, 88, 96, 0.18), transparent 70%),
      radial-gradient(ellipse 60% 40% at 10% 90%, rgba(82, 214, 186, 0.14), transparent 70%),
      var(--bg);
    display: flex;
    justify-content: center;
    padding: 48px 16px 32px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo {
    width: 128px; height: 128px; border-radius: 50%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--card-border);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; margin: 20px 0 6px; }
  .tagline { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
  .stripe {
    width: 72px; height: 4px; border-radius: 4px; margin: 20px auto 28px;
    background: linear-gradient(90deg, var(--mint), var(--gold), var(--coral));
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--text); text-decoration: none; text-align: left;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.24);
    outline: none;
  }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
  }
  .icon svg { width: 22px; height: 22px; }
  .link strong { display: block; font-size: 16px; font-weight: 600; }
  .link span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .soon {
    position: relative; overflow: hidden;
    border-color: rgba(255, 196, 80, 0.35);
    cursor: default;
  }
  .soon:hover { transform: none; }
  .soon::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 196, 80, 0.12) 50%, transparent 70%);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .logo, .soon::after { animation: none; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Mussiworks logosu" width="128" height="128">
  <h1>Mussiworks</h1>
  <p class="tagline" data-en="Original mobile games and useful apps">Özgün mobil oyunlar ve işe yarar uygulamalar</p>
  <div class="stripe" aria-hidden="true"></div>

  <nav class="links">
    <div class="link soon">
      <div class="icon" style="background: rgba(255, 196, 80, 0.16); color: var(--gold);">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
      </div>
      <div><strong data-en="Our first game is coming soon">İlk oyunumuz çok yakında</strong><span data-en="On Google Play">Google Play'de</span></div>
    </div>

    <a class="link" href="https://www.instagram.com/mussiworks/" target="_blank" rel="noopener">
      <div class="icon" style="background: rgba(236, 88, 96, 0.16); color: var(--coral);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div><strong>Instagram</strong><span>@mussiworks</span></div>
    </a>

    <a class="link" href="mailto:mail.m.karakas@gmail.com">
      <div class="icon" style="background: rgba(82, 214, 186, 0.16); color: var(--mint);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
      </div>
      <div><strong data-en="Contact">İletişim</strong><span>mail.m.karakas@gmail.com</span></div>
    </a>
  </nav>

  <footer>© 2026 Mussiworks</footer>
</main>
<script>
  // Turkish for Turkish phones, English for everyone else.
  if (!(navigator.language || "").toLowerCase().startsWith("tr")) {
    document.documentElement.lang = "en";
    document.querySelectorAll("[data-en]").forEach(function (el) {
      el.textContent = el.dataset.en;
    });
  }
</script>
</body>
</html>
